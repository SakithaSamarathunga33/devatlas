name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A push that only changes docs builds nothing and so publishes no release (release.yml
    # follows this workflow). A push that also changes code still runs everything.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Uses the pnpm version pinned in package.json#packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @devatlas/desktop test
      - run: pnpm --filter @devatlas/installer test
      - run: pnpm format:check
      - run: bash scripts/release-notes.test.sh

  rust:
    name: Rust checks (Windows)
    # windows-latest ships the MSVC build tools, the Windows SDK and WebView2,
    # which are the native dependencies Tauri needs on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # --locked: build exactly Cargo.lock, and fail if it is out of date.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace

  desktop-build:
    name: Windows desktop build
    needs: [frontend, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release

      - run: pnpm install --frozen-lockfile

      # Builds DevAtlas (frontend typecheck + Vite, release exe), then DevAtlas Setup with that
      # exe embedded: the one installer a release ships.
      - run: pnpm build:installer
        env:
          # The app compares this with the newest release tag (v<version>-build.<run>) to
          # tell the user an update exists; release.yml names the release after this run.
          DEVATLAS_BUILD: ${{ github.run_number }}

      # Setup, plus the app alone: release.yml packs and signs that as the in-app update.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: devatlas-windows-installers
          path: |
            target/release/devatlas-installer.exe
            target/release/devatlas-desktop.exe
          if-no-files-found: error
          retention-days: 7
