[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "apps/installer/src-tauri",
    "crates/domain",
    "crates/application",
    "crates/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/SakithaSamarathunga33/devatlas"
publish = false

[workspace.dependencies]
# Internal crates
devatlas-application = { path = "crates/application" }
devatlas-domain = { path = "crates/domain" }
devatlas-storage = { path = "crates/storage" }

# External crates — enable only the features that are actually used.
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
    "charset",
    "http2",
    "gzip",
] }
scraper = "0.29"
# The OS credential store, for the optional GitHub token.
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }
# RSS/Atom parsing for Discovery's news view.
feed-rs = "3"
# `join_all` to fetch news feeds concurrently.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde_json = "1"
# Project manifests (Cargo.toml, pyproject.toml) read for agents.
toml = "1"
# The Windows registry: the installer's Add/Remove Programs entry.
winreg = "0.56"
# Per-user folders when DevAtlas runs as an agent's MCP server, without a Tauri app.
dirs = "7"
# Model Context Protocol server over stdio, for AI coding agents.
rmcp = { version = "3.9", default-features = false, features = ["macros", "server", "transport-io"] }
# The embedded database. Runtime queries only, so no database is needed to compile.
sqlx = { version = "0.9", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
# Self-update: checks the update's minisign signature (keys from `tauri signer`), and unpacks it.
minisign-verify = "0.2"
base64 = "0.22"
flate2 = "1"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
